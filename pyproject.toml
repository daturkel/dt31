[project]
name = "dt31"
version = "0.11.0"
description = "A toy computer in Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dan Turkel", email = "daturkel@gmail.com" }]
maintainers = [{ name = "Dan Turkel", email = "daaturkel@gmail.com" }]
dependencies = []
license = { text = "MIT License" }
keywords = [
    "emulator",
    "assembly",
    "computer",
    "virtual-machine",
    "instruction-set",
    "toy-computer",
    "cpu",
    "interpreter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
    "Typing :: Typed",
]

[project.scripts]
dt31 = "dt31.cli:main"


[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "invoke==3.0.3",
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "genbadge[coverage]>=1.1.0",
    "pdoc>=14.7.0",
    "prek>=0.2.13",
]

[tool.ruff.lint]
# Ruff 0.16 dropped most of pycodestyle from the default rule set. E402, E711, E712,
# E721 and E741 are still worth having, and existing `noqa` comments depend on them.
extend-select = ["E"]
# Line length is the formatter's job.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Top-level command handlers catch everything so the CLI can print a message and exit.
"src/dt31/cli.py" = ["BLE001"]
# Runs standalone against a built wheel, reporting each check as pass/fail.
"tests/smoke_test.py" = ["BLE001"]
# Exercises the documented custom-instruction loader, which uses `exec`.
"tests/test_formatter.py" = ["S102"]
