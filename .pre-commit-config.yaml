repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/|\.svg$
      - id: trailing-whitespace
        exclude: ^docs/|\.svg$
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # The hook covers Markdown as of v0.16; the README's snippets are
        # hand-laid-out and the formatter undoes that.
        exclude: \.md$
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.17
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: format-examples
        name: Check example formatting
        entry: uv run dt31 format --check --align-comments
        language: system
        files: ^examples/.*\.dt$
      - id: generate-docs
        name: Generate documentation
        entry: uv run inv docs
        language: system
        pass_filenames: false
      - id: run-tests
        name: Run tests with coverage
        entry: uv run inv test --ci
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ty
        name: Run type checks with ty
        entry: uvx --with ty==0.0.83 ty check src/dt31
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: coverage-badge
        name: Generate coverage badge
        entry: uv run inv coverage-badge
        language: system
        pass_filenames: false
        stages: [pre-push]
